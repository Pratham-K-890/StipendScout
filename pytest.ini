[pytest]
pythonpath = .
# Without this, a bare `pytest` from the repo root also collects scripts/ —
# deliberately-manual live-verification scripts, not part of the automated
# suite — making routine runs fragile against whatever those happen to be
# doing at the time (confirmed live: they broke the same day a real bug got
# silenced with --ignore=scripts instead of being fixed at the source).
testpaths = tests
